server:
  port: 8080
spring:
  application:
    name: selection-system
  datasource:
    url: jdbc:h2:mem:lab;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    serialization:
      write-dates-as-timestamps: false
  # 演示项目会反复重新打包，jar 内资源的 Last-Modified 是固定的构建时间，
  # 浏览器会据此「启发式缓存」到几乎永久，改完前端看不到变化。这里直接禁掉缓存。
  web:
    resources:
      cache:
        cachecontrol:
          no-store: true
          no-cache: true
logging:
  level:
    root: warn
    edu.lab.select: info
